            const encryptedBytes = Uint8Array.from(atob(encryptedData), c => c.charCodeAt(0));
            const keyBytes = Uint8Array.from(atob(keyData), c => c.charCodeAt(0));
            
            // XOR decryption
            const decryptedBytes = new Uint8Array(encryptedBytes.length);
            for (let i = 0; i < encryptedBytes.length; i++) {
                decryptedBytes[i] = encryptedBytes[i] ^ keyBytes[i % keyBytes.length];
            }
            
            // Convert to string
            const decoder = new TextDecoder();
            const decryptedHTML = decoder.decode(decryptedBytes);
            
            // Write to document
            document.open();
            document.write(decryptedHTML);
            document.close();
            
        } catch (error) {
            console.error('Auto-decryption failed:', error);
            document.body.innerHTML = `
                <div style="padding: 50px; text-align: center; font-family: Arial, sans-serif;">
                    <h1 style="color: #ff4444;">⚠️ Decryption Error</h1>
                    <p>Failed to decrypt content. The file may be corrupted.</p>
                    <p>Error: ${error.message}</p>
                </div>
            `;
        }
    }
    
    // Start decryption when page loads
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', autoDecryptHTML);
    } else {
        autoDecryptHTML();
    }
    </script>
